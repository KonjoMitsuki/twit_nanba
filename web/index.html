<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投稿カレンダー | twit_nanba</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/calendar.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/apple-hig.css">
</head>
<body class="apple-app" data-page="calendar">
  <a class="skip-link" href="#calendar-main">カレンダーへ</a><div class="app-shell"><aside class="sidebar" aria-label="ワークスペース"></aside><div class="main-shell">
  <main id="calendar-main" class="shell">
    <section class="hero"><div><h1>投稿カレンダー</h1><p class="subline">月間の投稿・いいね・フォロワーの増減</p><p id="month-title" class="calendar-month-title">読み込み中</p></div><div class="month-controls"><button id="prev-month" class="icon-button" aria-label="前の月">‹</button><button id="today" class="today-button">今月</button><button id="next-month" class="icon-button" aria-label="次の月">›</button><button id="patrol-now" class="today-button">新着チェック</button></div></section>
    <a id="tracked-profile-link" class="x-link profile-link" href="#" target="_blank" rel="noreferrer" hidden>Xプロフィール ↗</a>
    <div class="calendar-view-toolbar"><button id="calendar-display" class="today-button" aria-pressed="false">作品画像を表示</button><span>日付を選択すると投稿を確認できます</span></div>
    <section id="calendar-overview" class="overview-card calendar-card"><div id="calendar-compact" class="compact-calendar"></div></section>
    <section class="summary" id="summary" aria-label="月間サマリー"></section>
    <section class="calendar-wrap"><div class="weekdays"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span></div><div id="calendar" class="calendar" aria-live="polite"></div></section>
  </main></div></div>

  <script src="/apple-shell.js"></script>
  <script src="/overview.js"></script>
  <script src="/app.js"></script>
</body>
</html>
